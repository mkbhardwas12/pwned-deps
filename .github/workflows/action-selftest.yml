name: Action self-test

# Validates action.yml end-to-end against the local checkout. Catches
# composite-step typos, input/output wiring, fail-on semantics, and
# SARIF-upload integration BEFORE the action is tagged on the
# Marketplace.
#
# Uses `version: from-source` so the action installs `pip install -e .`
# from this same checkout — no PyPI dependency, runs on every PR.

on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "src/**"
      - "tests/fixtures/npm/**"
      - "tests/fixtures/extras/**"
      - ".github/workflows/action-selftest.yml"
  pull_request:
    paths:
      - "action.yml"
      - "src/**"
      - "tests/fixtures/npm/**"
      - "tests/fixtures/extras/**"
      - ".github/workflows/action-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # for SARIF upload (only fires on default branch)

jobs:
  clean-fixture-passes:
    name: clean lockfile (online) -> exit 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run action against a clean fixture
        id: scan
        uses: ./
        with:
          path: tests/fixtures/npm/clean.lock.json
          version: from-source
          fail-on: compromised
          upload-sarif: "false"
      - name: Assert exit code 0
        env:
          RC: ${{ steps.scan.outputs.exit-code }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "expected 0, got $RC"
            exit 1
          fi

  offline-empty-cache-is-incomplete:
    name: offline + empty cache -> exit 4, never 'clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: fail-on=compromised must NOT fail on exit 4 (but reports it)
        id: lenient
        uses: ./
        with:
          path: tests/fixtures/npm/clean.lock.json
          version: from-source
          fail-on: compromised
          offline: "true"
          upload-sarif: "false"
      - name: fail-on=incomplete MUST fail on exit 4
        id: strict
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/npm/clean.lock.json
          version: from-source
          fail-on: incomplete
          offline: "true"
          upload-sarif: "false"
      - name: Assert
        env:
          LENIENT_RC: ${{ steps.lenient.outputs.exit-code }}
          STRICT_RC: ${{ steps.strict.outputs.exit-code }}
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
        run: |
          [ "$LENIENT_RC" = "4" ] || { echo "expected lenient exit-code 4, got $LENIENT_RC"; exit 1; }
          [ "$STRICT_RC" = "4" ] || { echo "expected strict exit-code 4, got $STRICT_RC"; exit 1; }
          [ "$STRICT_OUTCOME" = "failure" ] || { echo "expected fail-on=incomplete to fail the step"; exit 1; }

  malicious-fixture-fails:
    name: Mini Shai-Hulud fixture -> exit 1, action fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run action against the malicious fixture (must FAIL)
        id: scan
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/npm/mini-shaihulud.lock.json
          version: from-source
          fail-on: compromised
          offline: "true"
          upload-sarif: "false"
      - name: Assert action step failed AND exit-code output is 1
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          RC: ${{ steps.scan.outputs.exit-code }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "expected the scan step to FAIL on the malicious fixture, got outcome=$OUTCOME"
            exit 1
          fi
          if [ "$RC" != "1" ]; then
            echo "expected exit-code output=1, got $RC"
            exit 1
          fi

  fail-on-never-does-not-fail:
    name: fail-on=never -> never fails the step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run action against malicious fixture with fail-on=never
        id: scan
        uses: ./
        with:
          path: tests/fixtures/npm/mini-shaihulud.lock.json
          version: from-source
          fail-on: never
          offline: "true"
          upload-sarif: "false"
      - name: Assert step succeeded but exit-code output is still 1
        env:
          RC: ${{ steps.scan.outputs.exit-code }}
        run: |
          if [ "$RC" != "1" ]; then
            echo "expected exit-code output=1, got $RC"
            exit 1
          fi
