name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "13 6 * * *" # daily

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-safety:
    name: verify-safety (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run forbidden-symbol scanner
        run: python tools/verify_safety.py src tests
      - name: Negative self-test
        run: |
          set -e
          printf 'eval("1+1")\n' > tests/_safety_self_test_PLANTED.py
          if python tools/verify_safety.py src tests; then
            rm -f tests/_safety_self_test_PLANTED.py
            echo "FAIL: planted eval() not caught"
            exit 1
          else
            rm -f tests/_safety_self_test_PLANTED.py
            echo "OK: verify-safety caught the planted eval"
          fi

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    needs: verify-safety
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned dev dependencies
        run: pip install -r requirements.lock
      - name: Ruff
        run: ruff check src/ tests/

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    needs: verify-safety
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dev dependencies
        run: pip install -r requirements.lock
      - name: Pytest (default — `not network`)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest -ra

  dogfood:
    name: dogfood (pwned-deps check on itself)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pwned-deps editable
        run: pip install -e .
      - name: Scan our own pyproject.toml + requirements.lock
        # pyproject.toml is not a lockfile — pwned-deps will warn-and-skip.
        # requirements.lock is what actually gets scanned. Exit must be 0
        # (no MAL-* / EXTRA-*) or 2 (HIGH/CRITICAL). 1 = malicious, 4 =
        # incomplete scan (OSV unreachable) — both fail the job, because
        # an unchecked dependency is not a clean dependency.
        run: |
          set +e
          pwned-deps check ./pyproject.toml ./requirements.lock --ci
          rc=$?
          set -e
          case "$rc" in
            0|2) echo "dogfood exit code $rc (0=clean, 2=informational HIGH/CRITICAL)" ;;
            1) echo "FAIL: dogfood found a malicious package in our own deps"; exit 1 ;;
            *) echo "FAIL: dogfood scan incomplete or errored (exit $rc)"; exit 1 ;;
          esac
