name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege at the top; each job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag must match pyproject, __version__ and action.yml default
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          init=$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("src/pwned_deps/__init__.py").read()).group(1))')
          action_default=$(python -c 'import re;m=re.search(r"^  version:\n(?:    .*\n)*?    default: \"([^\"]*)\"", open("action.yml").read(), re.M);print(m.group(1) if m else "")')
          for candidate in "$ver" "$init" "$action_default"; do
            if [ "$tag" != "$candidate" ]; then
              echo "RELEASE BLOCKED: tag v$tag != '$candidate' (pyproject=$ver __init__=$init action.yml=$action_default)"
              exit 1
            fi
          done
      - name: Install pinned dev dependencies
        run: pip install -r requirements.lock
      - name: Pre-publish gates
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python tools/verify_safety.py src tests
          ruff check src/ tests/
          pytest -ra
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Pre-publish dogfood — must be a complete, non-malicious scan
        run: |
          pip install dist/*.whl
          set +e
          pwned-deps check ./pyproject.toml ./requirements.lock --ci
          rc=$?
          set -e
          case "$rc" in
            0|2) echo "dogfood exit $rc (0=clean, 2=informational HIGH/CRITICAL)" ;;
            1) echo "RELEASE BLOCKED: pwned-deps found a malicious package in our own deps."; exit 1 ;;
            *) echo "RELEASE BLOCKED: dogfood scan incomplete or failed (exit $rc)."; exit 1 ;;
          esac
      - name: Compute SLSA-friendly hashes for built artifacts
        id: hash
        run: |
          cd dist
          # base64-encoded sha256 manifest, fed to the SLSA generator below
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Upload built artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  provenance:
    name: SLSA Level 3 provenance (hard gate)
    needs: [build]
    permissions:
      id-token: write
      contents: write
      actions: read
    # Reusable SLSA workflows MUST be referenced by tag: slsa-verifier
    # checks the builder ID against a semantic version.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      # The github-release job below is the single point of truth for
      # what lands on the Release page. (v2.1.0 handles a skipped
      # upload-assets job correctly, so no continue-on-error is needed
      # — and none is set: if provenance cannot be produced, nothing
      # is published.)
      upload-assets: false
      provenance-name: pwned-deps-${{ github.ref_name }}.intoto.jsonl

  verify-provenance:
    name: verify provenance before publishing
    needs: [build, provenance]
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Download SLSA provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Verify every artifact against the provenance
        env:
          SOURCE_URI: github.com/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prov=$(ls provenance/*.intoto.jsonl | head -1)
          for f in dist/*; do
            slsa-verifier verify-artifact "$f" \
              --provenance-path "$prov" \
              --source-uri "$SOURCE_URI" \
              --source-tag "$TAG"
          done

  sign-feed:
    name: sign bundled campaign feed (sigstore)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install sigstore-python
        run: pip install --quiet "sigstore>=3.6,<4"
      - name: Sign extras.json (keyless; identity = this workflow @ this tag)
        run: |
          set -euo pipefail
          mkdir -p feed
          cp src/pwned_deps/extras_data/extras.json "feed/extras-${GITHUB_REF_NAME}.json"
          (cd feed && sha256sum "extras-${GITHUB_REF_NAME}.json" | tee "extras-${GITHUB_REF_NAME}.json.sha256")
          python -m sigstore sign \
            --bundle "feed/extras-${GITHUB_REF_NAME}.json.sigstore.json" \
            "feed/extras-${GITHUB_REF_NAME}.json"
      - name: Verify the bundle we just produced
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          python -m sigstore verify identity \
            --bundle "feed/extras-${GITHUB_REF_NAME}.json.sigstore.json" \
            --cert-identity "$IDENTITY" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            "feed/extras-${GITHUB_REF_NAME}.json"
      - name: Upload signed feed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-feed
          path: feed/
          if-no-files-found: error

  pypi-publish:
    name: PyPI publish (OIDC trusted publishing)
    needs: [build, provenance, verify-provenance, sign-feed]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No `password` / `api_token` — PyPI Trusted Publishers handles auth
        # via OIDC. The maintainer must register a Trusted Publisher entry
        # for this repository on PyPI before the first release.

  github-release:
    name: GitHub Release
    needs: [build, provenance, verify-provenance, sign-feed, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Download SLSA provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      - name: Download signed feed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-feed
          path: feed
      - name: Create release with auto-notes
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
            provenance/*
            feed/*
