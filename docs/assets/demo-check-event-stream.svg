</text><text class="terminal-654840268-r1" x="0" y="312.8" textLength="1390.8" clip-path="url(#terminal-654840268-line-12)">specific&#160;package.json&#160;description).&#160;Generic&#160;env-var&#160;theft&#160;was&#160;not&#160;the&#160;goal&#160;here&#160;—&#160;it&#160;is&#160;a&#160;targeted&#160;attack&#160;pattern.</text><text class="terminal-654840268-r1" x="1464" y="312.8" textLength="12.2" clip-path="url(#terminal-654840268-line-12)">
</text><text class="terminal-654840268-r1" x="0" y="337.2" textLength="1390.8" clip-path="url(#terminal-654840268-line-13)">&#160;&#160;&#160;&#160;&#160;&#160;•&#160;Obfuscated&#160;payload&#160;location:&#160;bottom&#160;of&#160;test/data.js&#160;in&#160;flatmap-stream@0.1.1&#160;(AES-256&#160;encrypted&#160;with&#160;a&#160;key&#160;</text><text class="terminal-654840268-r1" x="1464" y="337.2" textLength="12.2" clip-path="url(#terminal-654840268-line-13)">
