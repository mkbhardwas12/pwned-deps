</text><text class="terminal-654840268-r2" x="0" y="68.8" textLength="134.2" clip-path="url(#terminal-654840268-line-2)">COMPROMISED</text><text class="terminal-654840268-r1" x="134.2" y="68.8" textLength="183" clip-path="url(#terminal-654840268-line-2)">&#160;—&#160;2&#160;package(s)</text><text class="terminal-654840268-r1" x="1464" y="68.8" textLength="12.2" clip-path="url(#terminal-654840268-line-2)">
</text><text class="terminal-654840268-r1" x="0" y="93.2" textLength="244" clip-path="url(#terminal-654840268-line-3)">&#160;&#160;event-stream@3.3.6</text><text class="terminal-654840268-r1" x="1464" y="93.2" textLength="12.2" clip-path="url(#terminal-654840268-line-3)">
</text><text class="terminal-654840268-r1" x="0" y="117.6" textLength="841.8" clip-path="url(#terminal-654840268-line-4)">&#160;&#160;&#160;&#160;EXTRA-2018-0001&#160;&#160;event-stream&#160;/&#160;flatmap-stream&#160;credential&#160;stealer</text><text class="terminal-654840268-r1" x="1464" y="117.6" textLength="12.2" clip-path="url(#terminal-654840268-line-4)">
</text><text class="terminal-654840268-r1" x="0" y="142" textLength="1403" clip-path="url(#terminal-654840268-line-5)">&#160;&#160;&#160;&#160;event-stream&#160;/&#160;flatmap-stream&#160;credential&#160;stealer&#160;—&#160;In&#160;September&#160;2018&#160;the&#160;maintainer&#160;of&#160;the&#160;popular&#160;npm&#160;package&#160;</text><text class="terminal-654840268-r1" x="1464" y="142" textLength="12.2" clip-path="url(#terminal-654840268-line-5)">
</text><text class="terminal-654840268-r1" x="0" y="166.4" textLength="1464" clip-path="url(#terminal-654840268-line-6)">`event-stream`&#160;handed&#160;publish&#160;rights&#160;to&#160;a&#160;new&#160;contributor&#160;who&#160;immediately&#160;added&#160;`flatmap-stream@0.1.1`&#160;as&#160;a&#160;dependency.&#160;</text><text class="terminal-654840268-r1" x="1464" y="166.4" textLength="12.2" clip-path="url(#terminal-654840268-line-6)">
</text><text class="terminal-654840268-r1" x="0" y="190.8" textLength="1464" clip-path="url(#terminal-654840268-line-7)">That&#160;sub-dependency&#160;contained&#160;an&#160;obfuscated&#160;payload&#160;targeting&#160;the&#160;Copay&#160;Bitcoin&#160;wallet,&#160;attempting&#160;to&#160;exfiltrate&#160;wallet&#160;</text><text class="terminal-654840268-r1" x="1464" y="190.8" textLength="12.2" clip-path="url(#terminal-654840268-line-7)">
</text><text class="terminal-654840268-r1" x="0" y="215.2" textLength="1464" clip-path="url(#terminal-654840268-line-8)">keys&#160;when&#160;bundled&#160;into&#160;Copay&#x27;s&#160;release.&#160;Discovered&#160;Nov&#160;26,&#160;2018;&#160;affected&#160;anyone&#160;who&#160;installed&#160;`event-stream@3.3.6`&#160;(and</text><text class="terminal-654840268-r1" x="1464" y="215.2" textLength="12.2" clip-path="url(#terminal-654840268-line-8)">
</text><text class="terminal-654840268-r1" x="0" y="239.6" textLength="841.8" clip-path="url(#terminal-654840268-line-9)">transitively&#160;`flatmap-stream@0.1.1`)&#160;between&#160;Sept&#160;9&#160;and&#160;Nov&#160;26,&#160;2018.</text><text class="terminal-654840268-r1" x="1464" y="239.6" textLength="12.2" clip-path="url(#terminal-654840268-line-9)">
</text><text class="terminal-654840268-r1" x="0" y="264" textLength="463.6" clip-path="url(#terminal-654840268-line-10)">&#160;&#160;&#160;&#160;additional&#160;indicators&#160;to&#160;hunt&#160;for:</text><text class="terminal-654840268-r1" x="1464" y="264" textLength="12.2" clip-path="url(#terminal-654840268-line-10)">
