[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pwned-deps"
version = "0.1.0rc1"
description = "Drop your lockfile in, find out if you're pwned. Compromised-package scanner backed by OSV.dev."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "mkbhardwas12", email = "mkbhardwas12@users.noreply.github.com" },
]
keywords = [
    "supply-chain",
    "security",
    "lockfile",
    "osv",
    "malicious-packages",
    "shai-hulud",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

# Runtime dependencies are added per-step. Pins also live (versioned)
# in `requirements.lock` for the dev container; the `>=,<` ranges here
# are the loose floor for `pip install pwned-deps` users.
dependencies = [
    "click >=8.1,<9.0",
    "httpx >=0.27,<1.0",
    "packaging >=24.0,<28.0",
    "pyyaml >=6.0,<7.0",
    "rich >=13.0,<15.0",
    "tomli >=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mkbhardwas12/pwned-deps"
Repository = "https://github.com/mkbhardwas12/pwned-deps"
Issues = "https://github.com/mkbhardwas12/pwned-deps/issues"
Changelog = "https://github.com/mkbhardwas12/pwned-deps/blob/main/CHANGELOG.md"

[project.scripts]
pwned-deps = "pwned_deps.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pwned_deps"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pwned_deps",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not network"` keeps the live-OSV integration test out of the
# default run. Run it explicitly with `pytest -m network` from a
# host shell that has internet access (and outside the locked-down
# `make test` flags, which deny network).
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: tests that hit live api.osv.dev (opt-in via -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "B",     # flake8-bugbear
    "I",     # isort
    "S",     # flake8-bandit (security)
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
